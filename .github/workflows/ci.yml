name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install audio test tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm run check:public
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Start virtual audio output for browser playback checks
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=nicosampler_test
          pactl set-default-sink nicosampler_test
      - name: Mac touch controls (verified locally on Mac)
        if: runner.os == 'macOS'
        run: npm run test:touch
      - run: npm run test:browser
      - run: npm run test:recorder
      - run: npm run test:auto-assign
      - run: npm run test:phone
      - name: Mac piano gestures (verified locally on Mac)
        if: runner.os == 'macOS'
        run: npm run test:piano
